<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb"><title>Tambah Link — BEARN</title><link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/pages.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="/js/main.js"></script></head><body data-auth="required"><div data-component="navbar"></div><main class="app"><section class="hero"><span class="eyebrow">LINK CREATOR</span><h1>Buat link baru</h1><p class="muted">Pilih jenis link yang ingin kamu buat.</p></section><form id="createLinkForm" class="card"><div class="form-grid"><div class="field full"><label>Jenis Link</label><select name="type" id="linkType"><option value="auto">Auto Link</option><option value="payment">Payment Link</option></select></div><div class="field full"><label>Nama / Judul Link</label><input name="title" required maxlength="120" placeholder="Contoh: Link promosi saya"></div><div class="field full" id="destinationField"><label>URL tujuan Auto Link</label><input name="destination_url" type="url" placeholder="https://contoh.com"></div><div class="field full hidden" id="paymentFields"><label>Deskripsi pembayaran</label><textarea name="description" rows="3" placeholder="Jelaskan produk atau layanan"></textarea><label>Harga (Rp)</label><input name="price" type="number" min="1000" step="100" placeholder="10000"></div></div><div class="notice" style="margin-top:16px">Payment Link dikenakan biaya platform 10%. Contoh harga Rp10.000: biaya Rp1.000 dan pendapatan bersih Rp9.000. Pembayaran gateway belum diaktifkan.</div><div class="page-actions"><button class="btn" type="submit">Buat Link</button></div></form><script type="module">const s=document.getElementById('linkType'),d=document.getElementById('destinationField'),p=document.getElementById('paymentFields');function sync(){const pay=s.value==='payment';d.classList.toggle('hidden',pay);p.classList.toggle('hidden',!pay);d.querySelector('input').required=!pay;p.querySelector('input').required=pay;}s.addEventListener('change',sync);if(location.search.includes('payment'))s.value='payment';sync();</script></main><div data-component="footer"></div></body></html>
