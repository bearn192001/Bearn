<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pembayaran — BEARN</title><link rel="stylesheet" href="/css/payment.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="/js/payment.js"></script></head><body><div data-component="navbar"></div><main class="app narrow"><section class="hero"><span class="eyebrow">SECURE CHECKOUT</span><h1>Pembayaran</h1><p class="muted">Periksa detail pembayaranmu.</p></section><section class="card"><span id="checkoutType" class="pill">LINK</span><h2 id="checkoutTitle">Memuat detail…</h2><p id="checkoutDescription" class="muted"></p><div class="amount" id="checkoutAmount">—</div><div class="summary-row"><span>Biaya platform</span><b id="checkoutFee">—</b></div><div class="summary-row"><span>Total pembayaran</span><b id="checkoutTotal">—</b></div><div id="qrPanel" class="qr-panel hidden"><h3>Scan QR pembayaran</h3><img id="paymentQr" alt="QR pembayaran"><p id="paymentInstructions"></p><button id="checkPayment" class="btn secondary" type="button">Periksa status pembayaran</button></div><div id="paymentUnavailable" class="notice">Gateway DANA belum dikonfigurasi. Pembayaran belum dapat dilakukan.</div><p id="paymentMessage" class="muted" role="status"></p></section></main><div data-component="footer"></div></body></html>
