<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Auto Link — BEARN</title><link rel="stylesheet" href="/css/create-auto-link.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="/js/create-auto-link.js"></script></head><body data-auth="required"><div data-component="navbar"></div><main class="app"><section class="hero"><span class="eyebrow">AUTO LINK CREATOR</span><h1>Buat Auto Link</h1><p class="muted">Pilih akses gratis melalui tiga tahap atau akses langsung berbayar.</p></section><form id="autoCreateForm" class="card form-card"><div class="form-grid"><div class="field full"><label>Nama Auto Link</label><input name="title" required maxlength="120"></div><div class="field full"><label>URL tujuan</label><input name="destination_url" type="url" required placeholder="https://website-tujuan.com"></div><div class="field full"><label>Metode akses</label><div class="choice-grid"><label class="choice"><input type="radio" name="access_mode" value="free_tags" checked><span><b>Gratis lewat iklan</b><small>Tag 1, Tag 2, Tag 3, lalu Final Check.</small></span></label><label class="choice"><input type="radio" name="access_mode" value="paid_direct"><span><b>Direct Access</b><small>Pengunjung membayar Rp3.500 untuk membuka tujuan.</small></span></label></div></div></div><div class="notice">Direct Access ditetapkan Rp3.500 per pembelian. Pembayaran hanya dianggap berhasil setelah dikonfirmasi webhook gateway.</div><div class="page-actions"><button class="btn" type="submit">Buat Auto Link</button></div><p id="autoCreateMessage" class="muted" role="status"></p></form></main><div data-component="footer"></div></body></html>
