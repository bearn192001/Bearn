<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Payment Link — BEARN</title><link rel="stylesheet" href="/css/create-payment-link.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="/js/create-payment-link.js"></script></head><body data-auth="required"><div data-component="navbar"></div><main class="app"><section class="hero"><span class="eyebrow">PAYMENT LINK CREATOR</span><h1>Buat Payment Link</h1><p class="muted">Buat tautan pembayaran dengan nominal yang kamu tentukan.</p></section><form id="paymentCreateForm" class="card form-card"><div class="form-grid"><div class="field full"><label>Nama produk / layanan</label><input name="title" required maxlength="120"></div><div class="field full"><label>Deskripsi</label><textarea name="description" rows="3"></textarea></div><div class="field full"><label>Nominal pembayaran (Rp)</label><input name="price" type="number" min="1000" step="1" required placeholder="15000"></div></div><div class="fee-preview"><div><span>Biaya platform 10%</span><b id="feeValue">Rp0</b></div><div><span>Pendapatan bersih</span><b id="netValue">Rp0</b></div></div><div class="notice">QR DANA hanya dapat ditampilkan setelah gateway DANA/payment partner membuat instruksi pembayaran yang sah.</div><div class="page-actions"><button class="btn" type="submit">Buat Payment Link</button></div><p id="paymentCreateMessage" class="muted" role="status"></p></form></main><div data-component="footer"></div></body></html>
